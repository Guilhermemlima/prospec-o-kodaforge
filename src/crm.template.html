<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Koda Forge</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f1f3f6;--line:#e3e6eb;--text:#1b1f24;--muted:#667080;
  --accent:#1f7a5a;--accent-ink:#fff;--accent-soft:#e3f2ec;--wa:#1faa59;
  --red:#c2413a;--red-soft:#fbe9e7;--amber:#a86a00;--amber-soft:#fdf1d8;--blue:#2f5fb3;--blue-soft:#e6eefb;
  --purple:#7a46b8;--purple-soft:#f1e9fb;--s1:#2a78d6;--s2:#1baf7a;
  --shadow:0 8px 30px rgba(20,30,40,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418;--panel:#181c21;--panel2:#20252c;--line:#2b313a;--text:#e7eaee;--muted:#98a2b0;
  --accent:#3fb58a;--accent-ink:#0c1a14;--accent-soft:#17362b;--wa:#2bc46b;
  --red:#ef7a70;--red-soft:#3a1f1d;--amber:#e6b04a;--amber-soft:#3a2d12;--blue:#7ea6ef;--blue-soft:#1c2940;
  --purple:#b892ec;--purple-soft:#2c2140;--s1:#3987e5;--s2:#199e70;
  --shadow:0 8px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#111418;--panel:#181c21;--panel2:#20252c;--line:#2b313a;--text:#e7eaee;--muted:#98a2b0;
  --accent:#3fb58a;--accent-ink:#0c1a14;--accent-soft:#17362b;--wa:#2bc46b;
  --red:#ef7a70;--red-soft:#3a1f1d;--amber:#e6b04a;--amber-soft:#3a2d12;--blue:#7ea6ef;--blue-soft:#1c2940;
  --purple:#b892ec;--purple-soft:#2c2140;--s1:#3987e5;--s2:#199e70;
  --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
nav button.on{background:var(--accent-soft);color:var(--accent)}
nav button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px}
.stats{display:flex;gap:10px;padding:0 20px 12px;overflow-x:auto}
.stat{flex:1 0 110px;background:var(--panel2);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
main{padding:16px 20px 60px;max-width:1500px;margin:0 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.filters input[type=search]{flex:1 1 220px;min-width:180px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:var(--accent-soft)}
td.emp{font-weight:600;white-space:normal;min-width:200px}
td.emp small{display:block;font-weight:400;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted)}
.p-Alta{background:var(--red-soft);color:var(--red)}
.p-Média{background:var(--amber-soft);color:var(--amber)}
.p-Baixa{background:var(--panel2);color:var(--muted)}
.s-a_contatar,.s-sem_retorno{background:var(--panel2);color:var(--muted)}
.s-enviada,.s-fu1,.s-fu2,.s-ultima{background:var(--blue-soft);color:var(--blue)}
.s-respondeu{background:var(--amber-soft);color:var(--amber)}
.s-negociando{background:var(--purple-soft);color:var(--purple)}
.s-fechado{background:var(--accent-soft);color:var(--accent)}
.s-perdido{background:var(--red-soft);color:var(--red)}
.due{color:var(--red);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--panel2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--red)}
/* gaveta */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.15s;z-index:9}
.overlay.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--panel);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s;z-index:10;display:flex;flex-direction:column}
aside.on{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h2{margin:0;font-size:18px;line-height:1.25}
.dh .meta{color:var(--muted);font-size:13px;margin-top:3px}
.x{border:0;background:var(--panel2);border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none;font-size:18px}
.navbtns{display:flex;gap:4px}
.db{padding:16px 20px;overflow:auto;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:16px}
label.lb,.grid2 label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
.inp,.grid2 input,.grid2 select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea.inp{line-height:1.5;resize:vertical}
.field{margin-bottom:14px}
.info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.info .pill{font-weight:500}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sendbox{background:var(--accent-soft);border-radius:12px;padding:14px;margin-bottom:16px}
.sendbox h3{margin:0 0 10px;font-size:14px}
.cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cats button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.cats button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cats button .nx{color:var(--wa);margin-left:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.grid2.campgrid{grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr auto;align-items:end;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
@media (max-width:900px){.grid2.campgrid{grid-template-columns:1fr 1fr}}
.chips button.off{opacity:.45;text-decoration:line-through}
.chips button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:10px}
.vars label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.vars input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px}
.vars .empty input{border-color:var(--amber)}
#msg{min-height:200px;background:var(--panel)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warn{background:var(--amber-soft);color:var(--amber);padding:8px 10px;border-radius:8px;font-size:13px;margin:8px 0}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
.hist{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.hist li{padding:4px 0 8px 12px;position:relative;font-size:13px}
.hist li:before{content:"";position:absolute;left:-5px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.hist li.envio:before{background:var(--wa)}
.hist time{color:var(--muted);font-size:12px;margin-right:6px}
.hist .tag{font-size:11px;padding:1px 6px}
h4{margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* funil */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 240px;background:var(--panel2);border-radius:12px;padding:10px;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.col h3{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.col .cards{overflow:auto;display:flex;flex-direction:column;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card b{display:block;font-size:13px}
.card small{color:var(--muted);font-size:12px}
.card.drag{opacity:.4}
.col.over{outline:2px dashed var(--accent)}
/* hoje */
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box h3{margin:0 0 4px;font-size:15px}
.box p.sub{margin:0 0 10px;color:var(--muted);font-size:13px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.li:hover b{color:var(--accent)}
.li div{flex:1;min-width:0}
.li b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--muted)}
.meter{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--accent)}
/* modelos */
.cfg{display:grid;gap:16px;max-width:1100px}
.tplcat{margin-top:16px}
.tplcat h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 8px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.tcard b{font-size:14px}
.tcard pre{margin:0;font:13px/1.45 inherit;white-space:pre-wrap;color:var(--muted);max-height:7.3em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.tcard .row{margin-top:auto}
.v{color:var(--accent);font-weight:600}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px}
.dialog h3{margin:0 0 14px;font-size:17px}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ed textarea{min-height:280px}
.prev{background:var(--panel2);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:13px;line-height:1.5;min-height:280px}
.vchips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.vchips button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer;font-family:ui-monospace,Consolas,monospace}
.vchips button:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;transition:.2s;z-index:40;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.on{transform:translateX(-50%)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:7px;padding:3px 9px;cursor:pointer;font-weight:600;white-space:nowrap}
/* vendas */
.finbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:24px;margin:2px 0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi small{color:var(--muted);font-size:12px}
.kpi.pos b{color:var(--accent)} .kpi.neg b{color:var(--red)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:6px}
.lg i,.tip i{display:inline-block;width:10px;height:10px;border-radius:3px}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:absolute;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;min-width:190px;pointer-events:none}
.tip div{display:flex;align-items:center;gap:6px;margin-top:3px}
.tip span{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.tip .mut{color:var(--muted)}
table.ft{min-width:640px}
table.ft th{cursor:default}
table.ft td.r,table.ft th.r{text-align:right}
table.ft tbody tr{cursor:default}
table.ft a{color:var(--accent);font-weight:600;text-decoration:none}
/* painel lateral (extensão do Chrome) */
body.panel{font-size:13px}
body.panel header,body.panel main,body.panel .overlay,body.panel #prev,body.panel #next{display:none}
body.panel aside{position:static;transform:none;width:100%;box-shadow:none;display:none}
body.panel aside.on{display:flex}
body.panel .db{overflow:visible;padding:14px}
body.panel .dh{padding:12px 14px}
body.panel .dh h2{font-size:16px}
body.panel .x#close{font-size:14px;width:auto;padding:0 10px}
.pbar{position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center}
.pbar .chat{flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .chat b{color:var(--text)}
#panelHome{padding:12px;display:grid;gap:12px}
#panelHome .box{padding:12px 14px}
.pfound{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pfound b{flex:1 1 180px}
.qbar{display:flex;gap:8px;align-items:center;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:13px}
.qbar span{flex:1}
.hidden{display:none!important}
.empty{color:var(--muted);padding:20px;text-align:center}
@media (max-width:700px){
  .top{padding:10px 16px}.stats{padding:0 16px 10px}main{padding:12px 16px 60px}
  nav{margin-left:0;width:100%}
  .grid2,.ed{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Koda Forge <small>CRM de prospecção · Guarapuava</small></div>
    <nav id="tabs">
      <button data-v="hoje">Hoje<span class="n hidden" id="dueN"></span></button>
      <button data-v="lista" class="on">Leads</button>
      <button data-v="funil">Funil</button>
      <button data-v="vendas">Vendas e lucro</button>
      <button data-v="modelos">Modelos de mensagem</button>
      <button data-v="config">Ajustes</button>
    </nav>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section id="v-lista">
    <div class="filters">
      <input type="search" id="q" placeholder="Buscar empresa, categoria, bairro, telefone, contato…">
      <select id="fStatus"><option value="">Todos os status</option></select>
      <select id="fPrio"><option value="">Toda prioridade</option><option>Alta</option><option>Média</option><option>Baixa</option></select>
      <select id="fNicho"><option value="">Todos os nichos</option></select>
      <select id="fPres"><option value="">Toda presença</option><option value="A">A · Sem site</option><option value="B">B · Só rede social</option><option value="C">C · Site improvisado</option></select>
      <select id="fCanal"><option value="">Todo canal</option><option value="WhatsApp">WhatsApp</option><option value="Ligar (fixo)">Fixo</option><option value="Sem telefone">Sem telefone</option></select>
      <label class="chk"><input type="checkbox" id="fDue"> Só ações vencidas</label>
      <span class="count" id="count"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-s="pts">Prio.</th><th data-s="emp">Empresa</th><th data-s="bairro">Bairro</th><th data-s="pres">Presença</th>
          <th data-s="nota">Nota</th><th data-s="canal">Canal</th><th data-s="status">Etapa</th><th data-s="prox">Próx. ação</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
  <section id="v-funil" class="hidden">
    <p class="hint" style="margin-top:0">Arraste os cartões entre colunas para mudar a etapa. Clique para abrir.</p>
    <div class="kanban" id="kanban"></div>
  </section>
  <section id="v-hoje" class="hidden"><div class="today" id="today"></div></section>
  <section id="v-vendas" class="hidden"><div id="vendas"></div></section>
  <section id="v-modelos" class="hidden"><div class="cfg" id="modelos"></div></section>
  <section id="v-config" class="hidden"><div class="cfg" id="cfg"></div></section>
</main>

<div class="pbar hidden" id="panelBar"></div>
<div id="panelHome" class="hidden"></div>
<div class="overlay" id="ov"></div>
<aside id="dr" aria-label="Detalhes do lead"></aside>
<div id="modalRoot"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<script>
const DATA = /*__DATA__*/null;
const KEY = 'kodaforge-crm-v1';
// rodando como extensão do Chrome (aba do CRM ou painel lateral ao lado do WhatsApp Web)
const EXT = location.protocol==='chrome-extension:' && typeof chrome!=='undefined' && !!chrome.tabs;
const PANEL = EXT && !!window.KODA_PANEL;

/* ---------- etapas do funil ---------- */
const STAGES = [
  {k:'a_contatar', l:'A contatar'},
  {k:'enviada',    l:'1ª mensagem enviada'},
  {k:'fu1',        l:'Follow-up 1 enviado'},
  {k:'fu2',        l:'Follow-up 2 enviado'},
  {k:'ultima',     l:'Última mensagem enviada'},
  {k:'sem_retorno',l:'Sem retorno'},
  {k:'respondeu',  l:'Respondeu'},
  {k:'negociando', l:'Proposta / reunião'},
  {k:'fechado',    l:'Fechado'},
  {k:'perdido',    l:'Sem interesse'},
];
const SL = Object.fromEntries(STAGES.map(s=>[s.k,s.l]));
// categorias de modelos (cada uma é a etapa em que o lead fica depois do envio)
const CATS = [
  {k:'enviada',    l:'1ª mensagem',        e:'🟦', days:2},
  {k:'fu1',        l:'Follow-up 1',        e:'🟨', days:4},
  {k:'fu2',        l:'Follow-up 2',        e:'🟧', days:7},
  {k:'ultima',     l:'Última mensagem',    e:'🟥', days:7},
  {k:'respondeu',  l:'Respondeu',          e:'🟢', days:2},
  {k:'negociando', l:'Proposta / reunião', e:'🟣', days:3},

const V1_IDS = DEFAULT_TEMPLATES.map(t=>t.id);
function insertTpl(list, c){
  const t={...c}; delete t.pos;
  const same = list.filter(x=>x.etapa===t.etapa);
  let at;
  if(c.pos==='start'){ const first = same.find(x=>V1_IDS.includes(x.id)); at = first ? list.indexOf(first) : -1; }
  else if(c.pos!=='end'){ const ref = list.find(x=>x.id===c.pos); at = ref ? list.indexOf(ref) : -1; }
  if(at===undefined || at<0){ const last = same.at(-1); at = last ? list.indexOf(last)+1 : list.length; }
  list.splice(at, 0, t);
}

function daysUntil(d){ const [y,m,dd]=d.split('-').map(Number), t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,dd)-t)/864e5); }

const usedVars = txt => [...new Set([...String(txt).matchAll(VAR_RE)].map(m=>m[1]))];
/* Substitui as variáveis. Se uma variável estiver vazia:
   - contato/cidade/segmento: some só o trecho ("Olá, {{contato}}!" -> "Olá!", "em {{cidade}}" -> "")
   - demais: some a frase inteira; se a linha ficar vazia, some a linha. */
function renderTpl(content, vals){
  const empty = k => !String(vals[k] ?? '').trim();
  const out = [];
  for(let line of String(content).replace(/\r/g,'').split('\n')){
    if(!line.includes('{{')){ out.push(line); continue; }
    const startsVar = /^\s*\{\{/.test(line);
    for(const v of VARS.filter(v=>v.inline && empty(v.k))){
      const t = `\\{\\{\\s*${v.k}\\s*\\}\\}`;
      line = line.replace(new RegExp(`,\\s*(?:Dr\\(a\\)\\.\\s*)?${t}(?=\\s*[!?.,;:]|\\s*$)`,'g'),'')
                 .replace(new RegExp(`^(\\s*)${t}\\s*,\\s*`),'$1')
                 .replace(new RegExp(`\\s+(?:em|de|da|do|na|no|para|pra|com)\\s+${t}`,'gi'),'')
                 .replace(new RegExp(t,'g'),'');
    }
    const kept = line.split(/(?<=[.!?…])\s+/).filter(p => !usedVars(p).some(empty));
    if(!kept.length || !kept.join('').trim()) continue;
    line = kept.join(' ').replace(VAR_RE,(_,k)=>vals[k]).replace(/[ \t]+([!?.,;])/g,'$1').replace(/ {2,}/g,' ');
    if(startsVar) line = line.replace(/^(\s*)(\p{Ll})/u,(m,a,b)=>a+b.toUpperCase());
    out.push(line);
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ---------- regras automáticas ---------- */
function housekeeping(){
  let changed=false;
  for(const l of leads){
    if(l.s.status==='ultima' && l.s.prox && l.s.prox<=today()){
      l.s.status='sem_retorno'; l.s.prox=null; log(l,'Etapa: Última mensagem enviada → Sem retorno (automático)'); changed=true;
    }
  }
  if(changed) save();
}
function statusAfterSend(cur, cat){
  if(cur==='fechado') return cur;
  if(SEQ.includes(cat)){
    if(cur==='a_contatar' || cur==='sem_retorno') return cat;
    if(SEQ.includes(cur) && SEQ.indexOf(cat) > SEQ.indexOf(cur)) return cat;
    return cur;
  }
  if(cat==='respondeu') return ['respondeu','negociando'].includes(cur) ? cur : 'respondeu';
  if(cat==='negociando') return 'negociando';
  return cur;
}

let selCat=null, selTpl=null;
function defaultTpl(l, cat){
  const list = tplsOf(cat); if(!list.length) return null;
  const act = list.filter(t=>tplActive(t));
  const pick = arr => (arr.find(t=>t.nicho===l.nicho) || arr.find(t=>!t.nicho))?.id;
  // depois de "Posso te enviar?" no follow-up 2, quem responde geralmente quer os valores
  if(cat==='respondeu'){
    const last=[...l.s.hist].reverse().find(h=>h.tipo==='envio');
    if(last && last.cat==='fu2'){ const p=act.find(t=>t.preco) || tplById('r_preco'); if(p) return p.id; }
  }
  // quem já conversou antes recebe o modelo de reativação, se houver um valendo
  if(cat==='enviada' && l.s.hist.some(h=>h.tipo==='envio')){ const r=act.find(t=>t.reat); if(r) return r.id; }
  // nos modelos gerais, os de nicho só entram se forem do nicho do lead
  return pick(act.filter(t=>!t.nicho || t.nicho===l.nicho)) || act[0]?.id || list[0].id;
}

  if(!keep || changedLead){ selCat = NEXT_CAT[l.s.status]; selTpl = defaultTpl(l, selCat); }

  if(PANEL){ $('#panelHome').classList.add('hidden'); renderPanelBar(); if(changedLead) window.scrollTo(0,0); }
}

  document.querySelectorAll('[data-editv]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.editv.split(':'); openFinForm(k,id); });

  if($('#openOnly')) $('#openOnly').onclick=async()=>handleWAResult(l, await openWA(l,$('#msg').value));

}
function copyText(s){
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(s).catch(()=>fallbackCopy(s)); else fallbackCopy(s);
}
function fallbackCopy(s){ const ta=document.createElement('textarea'); ta.value=s; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); }
const snapshot = l => JSON.parse(JSON.stringify(l.s));
function restore(l,snap){ st.leads[l.id]=snap; save(); refresh(); if(current===l.id) openLead(l.id); }
function log(l,txt,extra){ l.s.hist.push(Object.assign({t:nowStr(), txt}, extra||{})); }
function setStatus(l,k){
  if(l.s.status===k) return;
  const snap=snapshot(l);
  log(l,'Etapa: '+SL[l.s.status]+' → '+SL[k]); l.s.status=k;
  if(['fechado','perdido','sem_retorno'].includes(k)) l.s.prox=null;
  if(['respondeu','negociando'].includes(k) && (!l.s.prox || l.s.prox<today())) l.s.prox=today();
  save(); refresh(); if(current===l.id) openLead(l.id);
  toast(l.emp+': '+SL[k],'Desfazer',()=>restore(l,snap));
  if(k==='fechado') promptSale(l);
}
function openWA(l,text){
  if(EXT) return extOpenWA(l,text);
  const ph=phone(l), t=encodeURIComponent(text);
  if(st.cfg.modo==='app') location.href=`whatsapp://send?phone=${ph}&text=${t}`;
  else if(st.cfg.modo==='wame') window.open(`https://wa.me/${ph}?text=${t}`,'kodaforge_wa');
  else window.open(`https://web.whatsapp.com/send?phone=${ph}&text=${t}`,'kodaforge_wa');
  return {ok:true};
}
function registerSend(l,t,text,advance){
  const snap=snapshot(l), from=l.s.status, to=statusAfterSend(from,t.etapa);
  log(l,'Enviou '+t.nome,{tipo:'envio', tplId:t.id, tplNome:t.nome, cat:t.etapa, editada: text.trim()!==fillFor(t,l).trim(), para: to!==from?to:undefined});
  if(!l.s.data1) l.s.data1=today();
  if(to!==from || ['respondeu','negociando'].includes(t.etapa)){ l.s.status=to; l.s.prox=addDays(CL[t.etapa].days); }
  save(); refresh();
  toast(`Registrado: ${t.nome}`+(to!==from?` · ${l.emp} → ${SL[to]}`:''),'Desfazer',()=>restore(l,snap));
  if(PANEL && queue && queue[qi]===l.id){ nextInQueue(); return; }
  const i=visible.findIndex(x=>x.id===l.id);
  const nxt = advance && st.cfg.avancar && SEQ.includes(t.etapa) ? visible.slice(i+1).find(x=>SEQ.includes(x.s.status) && x.s.status!=='ultima' && phone(x) && !x.s.semWA) : null;
  if(nxt && !PANEL && !$('#v-lista').classList.contains('hidden')) openLead(nxt.id); else if(current===l.id) openLead(l.id);
}
async function send(l,t){
  const text=$('#msg').value.trim();
  if(!text){ toast('Mensagem vazia'); return; }
  if(/\{\{|\[[A-ZÀ-Ú ]{3,}\]/.test(text) && !confirm('A mensagem ainda tem um campo para completar. Enviar assim mesmo?')) return;
  if(sentToday()>=st.cfg.meta && !confirm(`Você já registrou ${sentToday()} envios hoje (limite: ${st.cfg.meta}). Muitos envios seguidos para desconhecidos podem fazer o WhatsApp bloquear seu número. Continuar?`)) return;
  const r = await openWA(l,text);
  if(!handleWAResult(l,r)) return;
  registerSend(l,t,text,true);
}
// trata o retorno de openWA; devolve false quando não deu para abrir a conversa
function handleWAResult(l,r){
  if(r?.ok!==false) return true;
  if(r.reason==='no-whatsapp'){
    if(!l.s.semWA){ l.s.semWA=true; log(l,'Número sem WhatsApp'); save(); refresh(); }
    if(current===l.id) openLead(l.id,true);
    toast(`${l.emp}: este número não tem WhatsApp. Ligue e peça o WhatsApp do responsável.`,'Copiar número',()=>copyText(l.tel));
  } else toast('Não consegui abrir a conversa. Tente de novo em alguns segundos.');
  return false;
}

function deleteTpl(id){

/* ---------- campanhas: metas e checklist ---------- */
function campaignProgress(c){
  const inW = d => d && d>=c.inicio && d<=c.fim;
  const vs = st.fin.vendas.filter(v=>inW(v.data)), ms = st.fin.mensais.filter(m=>inW(m.inicio));
  const ids = new Set([...vs, ...ms].map(x=>x.leadId || 'c:'+x.cliente));
  return {clientes: ids.size, vendido: vs.reduce((a,v)=>a+v.valor,0), fixa: ms.reduce((a,m)=>a+m.valor,0)};
}
function meterRow(label, val, meta, fmt){
  const pct = meta ? Math.min(100, Math.round(val/meta*100)) : 0;
  return `<div style="margin:8px 0"><div class="row" style="justify-content:space-between;font-size:13px"><span>${label}</span><span class="num"><b>${fmt(val)}</b> de ${fmt(meta)} · ${pct}%</span></div><div class="meter" style="margin:4px 0"><i style="width:${pct}%"></i></div></div>`;
}
function campaignBox(c, compact){
  const pr = campaignProgress(c), d = today(), state = d<c.inicio ? `começa em ${daysUntil(c.inicio)} dia(s)` : d>c.fim ? 'encerrada' : daysUntil(c.fim)===0 ? '<b class="due">último dia!</b>' : `faltam ${daysUntil(c.fim)} dia(s)`;
  return `<div class="box"><h3>${esc(c.nome)}</h3><p class="sub">${br(c.inicio)} a ${br(c.fim)} · ${state}</p>
    ${meterRow('Clientes fechados', pr.clientes, c.metaClientes, n=>n)}
    ${meterRow('Vendido', pr.vendido, c.metaVendido, brl)}
    ${meterRow('Receita fixa nova', pr.fixa, c.metaFixa, n=>brl(n)+'/mês')}
    ${compact?'':`<p class="hint">Conta as vendas e mensalidades registradas em "Vendas e lucro" com data dentro da campanha.</p>`}</div>`;
}
function checklistBox(){
  const d=today(), items=[...st.checklist].sort((a,b)=>(a.feito-b.feito) || (a.data||'').localeCompare(b.data||''));
  const feitos=st.checklist.filter(i=>i.feito).length;
  return `<div class="box"><h3>Checklist da campanha</h3><p class="sub">${feitos} de ${st.checklist.length} concluídos</p>
    ${items.map(i=>`<label class="chk" style="color:var(--text);padding:5px 0;border-top:1px solid var(--line);align-items:flex-start">
      <input type="checkbox" data-ck="${i.id}" ${i.feito?'checked':''} style="margin-top:3px">
      <span style="flex:1;${i.feito?'text-decoration:line-through;color:var(--muted)':''}">${i.data?`<b class="${!i.feito&&i.data<d?'due':''}">${br(i.data)}</b> · `:''}${esc(i.txt)}</span>
      <button class="btn xs" data-ckdel="${i.id}" title="Remover">×</button></label>`).join('')}
    <div class="row" style="margin-top:8px"><input class="inp" id="ckTxt" placeholder="Nova tarefa" style="flex:1;min-width:140px"><input class="inp" type="date" id="ckData" style="width:150px"><button class="btn xs" id="ckAdd">Adicionar</button></div></div>`;
}
function bindChecklist(rerender){

function download(name,content,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function exportCSV(){
  const cols=[['#','id'],['Prioridade','prio'],['Pontos','pts'],['Empresa','emp'],['Nicho','nicho'],['Categoria','cat'],['Presença digital','pres'],['Telefone','tel'],['Canal','canal'],['Bairro','bairro'],['Nota','nota'],['Avaliações','aval'],['Google Maps','maps']];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=[...cols.map(c=>c[0]),'Contato','Etapa','1º contato','Próxima ação','Mensagens enviadas','Último modelo enviado','Observações'];
  const lines=leads.map(l=>{ const env=l.s.hist.filter(h=>h.tipo==='envio'), u=env.at(-1);
    return [...cols.map(c=>l[c[1]]), l.s.contato, SL[l.s.status], br(l.s.data1), br(l.s.prox), env.length, u?`${u.t} · ${u.tplNome||u.txt}`:'', l.s.obs].map(q).join(';'); });
  download(`crm-kodaforge-${today()}.csv`, '﻿'+[head.map(q).join(';'),...lines].join('\r\n'), 'text/csv');
}

/* ---------- vendas e lucro ---------- */
// vendas: projetos (valor único) · mensais: manutenção recorrente · despesas: avulsas ou mensais fixas
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl = n => BRL.format(n||0);
const brlShort = n => Math.abs(n)>=1000 ? 'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : brl(n).replace(',00','');
function parseMoney(v){
  let s=String(v??'').replace(/[^\d,.-]/g,''); if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return Math.round((parseFloat(s)||0)*100)/100;
}
const ym = d => d.slice(0,7);
const curYM = () => today().slice(0,7);
function addMonths(m,n){ let [y,mo]=m.split('-').map(Number); mo+=n; while(mo>12){mo-=12;y++;} while(mo<1){mo+=12;y--;} return y+'-'+String(mo).padStart(2,'0'); }
function monthsBetween(a,b){ const out=[]; for(let m=a; m<=b; m=addMonths(m,1)) out.push(m); return out; }
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mLabel = m => MES[+m.slice(5)-1]+'/'+m.slice(2,4);
const activeIn = (ini,fim,m) => ini && ym(ini)<=m && (!fim || ym(fim)>=m);

function monthFigures(m){
  const F=st.fin, r={m, vendas:0, custoVendas:0, mensal:0, custoMensal:0, despesas:0, nVendas:0};
  for(const v of F.vendas) if(ym(v.data)===m){ r.vendas+=v.valor; r.custoVendas+=v.custo||0; r.nVendas++; }
  for(const c of F.mensais) if(activeIn(c.inicio,c.fim,m)){ r.mensal+=c.valor; r.custoMensal+=c.custo||0; }
  for(const d of F.despesas) if(d.mensal ? activeIn(d.data,d.fim,m) : ym(d.data)===m) r.despesas+=d.valor;
  r.fat=r.vendas+r.mensal; r.custos=r.custoVendas+r.custoMensal+r.despesas; r.lucro=r.fat-r.custos;
  return r;
}
const PERIODS = {mes:'Este mês', ant:'Mês anterior', tri:'Últimos 3 meses', ano:'Este ano', d12:'Últimos 12 meses', tudo:'Tudo'};
function periodRange(p){
  const c=curYM();
  if(p==='ant') return [addMonths(c,-1), addMonths(c,-1)];
  if(p==='tri') return [addMonths(c,-2), c];
  if(p==='ano') return [c.slice(0,4)+'-01', c];
  if(p==='d12') return [addMonths(c,-11), c];
  if(p==='tudo'){
    const F=st.fin, ds=[...F.vendas.map(v=>v.data), ...F.mensais.map(x=>x.inicio), ...F.despesas.map(d=>d.data)].filter(Boolean).sort();
    return [ds.length?ym(ds[0]):c, c];
  }
  return [c,c];
}

function renderFinChart(a,b){
  const rows = monthsBetween(a,b).map(monthFigures);
  if(finTable){
    $('#finChart').innerHTML = `<div class="tablewrap"><table class="ft"><thead><tr><th>Mês</th><th class="r">Faturamento</th><th class="r">Custos</th><th class="r">Lucro</th><th class="r">Vendas</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${mLabel(r.m)}</td><td class="r num">${brl(r.fat)}</td><td class="r num">${brl(r.custos)}</td><td class="r num">${brl(r.lucro)}</td><td class="r num">${r.nVendas}</td></tr>`).join('')}</tbody></table></div>`;
    return;
  }
  const W=Math.max(320, $('#finChart').clientWidth||800), H=240, padL=64, padR=8, padT=12, padB=26;
  const vals = rows.flatMap(r=>[r.fat,r.lucro]);
  let max=Math.max(0,...vals), min=Math.min(0,...vals);
  if(max===min) max=1000;
  const step = niceStep((max-min)/4); max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step;
  const y = v => padT+(max-v)/(max-min)*(H-padT-padB);
  const band=(W-padL-padR)/rows.length, bw=Math.min(18,(band-10)/2);
  let ticks=''; for(let v=min; v<=max+1e-9; v+=step) ticks+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'':'stroke-dasharray="2 3"'}/><text x="${padL-8}" y="${y(v)+4}" text-anchor="end" class="ax">${brlShort(v)}</text>`;
  const bar=(v,x,fill)=>{ if(!v) return ''; const y0=y(0), y1=y(v), h=Math.max(1,Math.abs(y0-y1)), top=Math.min(y0,y1), r=Math.min(4,h,bw/2);
    // canto arredondado só na ponta do dado, base reta no zero
    return v>0 ? `<path d="M${x},${y0} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y0} Z" fill="${fill}"/>`
               : `<path d="M${x},${y0} V${top+h-r} Q${x},${top+h} ${x+r},${top+h} H${x+bw-r} Q${x+bw},${top+h} ${x+bw},${top+h-r} V${y0} Z" fill="${fill}"/>`; };
  const g = rows.map((r,i)=>{ const cx=padL+band*i+band/2, x1=cx-bw-1, x2=cx+1;
    return `<g><rect x="${padL+band*i}" y="${padT}" width="${band}" height="${H-padT-padB}" fill="transparent" rx="6" class="bgh"/>${bar(r.fat,x1,'var(--s1)')}${bar(r.lucro,x2,'var(--s2)')}<text x="${cx}" y="${H-8}" text-anchor="middle" class="ax">${mLabel(r.m)}</text>
      <rect x="${padL+band*i}" y="${padT}" width="${band}" height="${H-padT-padB}" fill="transparent" data-i="${i}" class="hit"/></g>`; }).join('');
  $('#finChart').innerHTML = `<div style="position:relative"><svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento e lucro dos últimos 12 meses">${ticks}${g}</svg><div class="tip hidden" id="finTip"></div></div>`;
  const tip=$('#finTip');
  $('#finChart').querySelectorAll('.hit').forEach(h=>{
    h.onmouseenter=()=>{ const r=rows[+h.dataset.i]; h.parentNode.querySelector('.bgh').setAttribute('fill','var(--panel2)');
      tip.innerHTML=`<b>${mLabel(r.m)}</b><div><i style="background:var(--s1)"></i>Faturamento <span>${brl(r.fat)}</span></div><div><i style="background:var(--s2)"></i>Lucro <span>${brl(r.lucro)}</span></div><div class="mut">Custos ${brl(r.custos)} · ${r.nVendas} venda(s)</div>`;
      tip.classList.remove('hidden'); const sv=$('#finChart svg').getBoundingClientRect(), hb=h.getBoundingClientRect();
      let left=hb.left-sv.left+hb.width/2+8; if(left+200>sv.width) left=hb.left-sv.left+hb.width/2-208; tip.style.left=left+'px'; tip.style.top='8px'; };
    h.onmouseleave=()=>{ h.parentNode.querySelector('.bgh').setAttribute('fill','transparent'); tip.classList.add('hidden'); };
  });
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))), n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

// follow-ups vencidos primeiro, depois leads novos com WhatsApp, por prioridade
let queue=null, qi=0;
function buildQueue(){
  const ok = l => phone(l) && !l.s.semWA;
  const due = leads.filter(l=>isDue(l) && ok(l) && SEQ.includes(l.s.status)).sort((a,b)=>(a.s.prox>b.s.prox?1:-1));
  const novos = leads.filter(l=>l.s.status==='a_contatar' && ok(l) && l.canal==='WhatsApp').sort((a,b)=>b.pts-a.pts || (b.aval||0)-(a.aval||0));
  return [...due, ...novos].map(l=>l.id);
}
function startQueue(){ queue=buildQueue(); qi=0; if(!queue.length){ queue=null; toast('Nenhum lead na fila.'); return; } openLead(queue[0]); }
function nextInQueue(){
  qi++;
  while(queue && qi<queue.length && !SEQ.includes(byId[queue[qi]].s.status)) qi++;
  if(!queue || qi>=queue.length){ queue=null; toast('Fila concluída! 🎉'); current=null; $('#dr').classList.remove('on'); renderPanelHome(); return; }
  openLead(queue[qi]);
}
function stopQueue(){ queue=null; renderPanelBar(); if(current) openLead(current,true); }

/* ---------- extensão: ponte com o WhatsApp Web ---------- */
// wa.info = conversa aberta no WhatsApp Web (enviada pelo wa.js); wa.leadId = lead dessa conversa
const wa = {tabId:null, info:null, chats:[], leadId:null, lastTitle:null, expect:null};
const byPhone8 = new Map(leads.filter(l=>phone(l)).map(l=>[phone(l).slice(-8), l.id]));
function matchChat(title, extra){
  if(!title) return null;
  const link = (st.waLinks||{})[title];
  if(link && byId[link]) return link;
  for(const txt of [title, extra||'']){
    for(const m of txt.match(/\+?\d[\d\s().-]{8,}\d/g)||[]){
      const d=m.replace(/\D/g,''); if(d.length>=10 && byPhone8.has(d.slice(-8))) return byPhone8.get(d.slice(-8));
    }
  }
  const nt=norm(title).replace(/[^a-z0-9 ]/g,'').trim();
  if(nt.length<4) return null;
  const exact=leads.filter(l=>norm(l.emp)===nt); if(exact.length===1) return exact[0].id;
  if(nt.length>=6){ const part=leads.filter(l=>{ const e=norm(l.emp); return e.includes(nt)||nt.includes(e); }); if(part.length===1) return part[0].id; }
  return null;
}
async function waTab(){
  const tabs = await chrome.tabs.query({url:'https://web.whatsapp.com/*'});
  return tabs.find(t=>t.id===wa.tabId) || tabs.find(t=>t.active) || tabs[0] || null;
}
async function extOpenWA(l,text){
  const url=`https://web.whatsapp.com/send?phone=${phone(l)}&text=${encodeURIComponent(text)}`;
  const tab=await waTab();
  if(wa.leadId===l.id && tab){
    try{
      const r=await chrome.tabs.sendMessage(tab.id,{type:'koda-insert', text});
      if(r?.ok){ if(!PANEL){ chrome.tabs.update(tab.id,{active:true}); chrome.windows.update(tab.windowId,{focused:true}); } return {ok:true}; }
    }catch(e){}
    copyText(text); toast('Não consegui colocar o texto na conversa. Ele foi copiado: cole com Ctrl+V.'); return {ok:true};
  }
  if(!phone(l)){ copyText(text); toast('Lead sem telefone. Texto copiado.'); return {ok:false, reason:'no-phone'}; }
  if(!tab){ chrome.tabs.create({url}); return {ok:true}; }
  // caminho rápido: abre a conversa por dentro do WhatsApp Web, sem recarregar a página
  wa.expect = {id:l.id, until:Date.now()+15000};
  try{
    const r = await chrome.tabs.sendMessage(tab.id,{type:'koda-open', phone:phone(l), text});
    if(r?.ok){ if(!PANEL){ chrome.tabs.update(tab.id,{active:true}); chrome.windows.update(tab.windowId,{focused:true}); } return {ok:true}; }
    if(r?.reason==='no-whatsapp'){ wa.expect=null; return r; }
  }catch(e){}
  // plano B: abre pelo link (a página do WhatsApp Web recarrega)
  await chrome.tabs.update(tab.id,{url, active:true});
  chrome.windows.update(tab.windowId,{focused:true});
  return {ok:true};
}
function onWaUpdate(msg){
  wa.info=msg.info||null; wa.chats=msg.chats||[];
  const title = wa.info?.open ? wa.info.title : null;
  wa.leadId = title ? matchChat(title, wa.info.headerText) : null;
  if(!PANEL){ if(current && current===wa.leadId) openLead(current,true); return; }
  const changed = title!==wa.lastTitle; wa.lastTitle=title;
  const exp = wa.expect && Date.now()<wa.expect.until ? wa.expect : null;
  if(changed && exp && title && (!wa.leadId || wa.leadId===exp.id)){
    if(!wa.leadId){ (st.waLinks ||= {})[title]=exp.id; save(); wa.leadId=exp.id; }
    wa.expect=null;
    if(current) openLead(current,true); else renderPanelHome();
    renderPanelBar(); return;
  }
  if(changed && wa.leadId) openLead(wa.leadId);
  else if(changed && current){ current=null; $('#dr').classList.remove('on'); renderPanelHome(); }
  else if(current) openLead(current,true);
  else renderPanelHome();
  renderPanelBar();
}

  if($('#pQueue')) $('#pQueue').onclick=startQueue;
  if($('#pOpenWA')) $('#pOpenWA').onclick=()=>chrome.tabs.create({url:'https://web.whatsapp.com/'});
  const search = q => { const n=norm(q.trim()); return n.length<2?[]:leads.filter(l=>norm([l.emp,l.cat,l.bairro,l.s.contato].join(' ')).includes(n)).slice(0,8); };
  $('#pQ').oninput=e=>{ $('#pR').innerHTML=search(e.target.value).map(l=>item(l)).join(''); bindItems($('#pR')); };
  if($('#pLinkQ')) $('#pLinkQ').oninput=e=>{
    $('#pLinkR').innerHTML=search(e.target.value).map(l=>item(l,'<button class="btn xs">Vincular</button>')).join('');
    $('#pLinkR').querySelectorAll('.li').forEach(x=>x.onclick=()=>linkChat(t,+x.dataset.id));
  };
}
async function initExt(){
  chrome.runtime.onMessage.addListener((msg,sender)=>{ if(msg?.type==='koda-wa'){ wa.tabId=sender.tab?.id||wa.tabId; onWaUpdate(msg); } });
  chrome.tabs.onRemoved.addListener(id=>{ if(id===wa.tabId){ wa.tabId=null; onWaUpdate({}); } });
  const tab=await waTab();
  if(tab){ wa.tabId=tab.id; try{ const r=await chrome.tabs.sendMessage(tab.id,{type:'koda-get'}); if(r) return onWaUpdate(r); }catch(e){} }
  onWaUpdate({});
}

housekeeping();
renderStats(); renderList();
if(PANEL){ document.body.classList.add('panel'); $('#panelBar').classList.remove('hidden'); renderPanelHome(); }
else { let startTab='hoje'; try{ startTab=sessionStorage.getItem(KEY+'-tab')||'hoje'; }catch(e){} show(VIEWS.includes(startTab)?startTab:'hoje'); }
if(EXT) initExt();
</script>
